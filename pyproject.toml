[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asofrag"
version = "0.1.0"
description = "Point-in-time retrieval and citation checking for HR policy Q&A over a versioned handbook."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "asofrag contributors" }]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
asofrag = "asofrag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/asofrag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["asofrag", "conftest"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = ["live: calls a real model endpoint; needs ASOFRAG_LIVE=1"]
